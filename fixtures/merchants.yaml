# Merchants in the range.
#
# `reputation`, `age_days` and `signed_listings` are Tier 2's features, so the
# population is built so that NO SINGLE ONE OF THEM SEPARATES honest from
# attacker-controlled. With four merchants, reputation was effectively a
# merchant id and the model learned a lookup table; the ranges below overlap
# deliberately so a useful model has to combine signals.
#
# Attacker-controlled merchants are listed in praman/range/context.py, not
# flagged here — the range must not hand the defense the answer.

# -- honest, established ----------------------------------------------------
