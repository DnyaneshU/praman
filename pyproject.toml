[project]
name = "praman"
version = "0.1.0"
description = "Breach and attack simulation for agentic payment mandate controls"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Tier 2 only. Kept out of the base install so the container carries neither —
# the deployed arena replays committed results and never fits a model.
#
# sentence-transformers was declared here and never imported: Tier 3 runs a
# lexicon, not an embedding model. It was pulling torch for nothing.
ml = [
    "lightgbm>=4.5",
    "numpy>=1.26",
]
# Builds the submission walkthrough. Nothing the app serves imports it.
docs = [
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
    "python-docx>=1.1",
    # The suite trains Tier 2, so a dev install has to be able to.
    "lightgbm>=4.5",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["praman*"]

# Without this the wheel is Python files and nothing else — no arena, no
# corpus.yaml — and an installed Praman 404s every asset and crashes on
# `load_corpus()`. The container hid it: it runs from /app with praman/ copied
# alongside, so the source tree wins on sys.path and the install is only ever
# supplying dependencies. Listed explicitly rather than with `**` so a new kind
# of asset has to be declared instead of silently not shipping.
[tool.setuptools.package-data]
praman = [
    "red/*.yaml",
    "api/static/*.html",
    "api/static/*.css",
    "api/static/*.js",
    "api/static/vendor/*.js",
    "api/static/vendor/*.css",
    "api/static/vendor/fonts/*.woff2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
