name: deploy to hugging face

# The arena deploys as static files, not as a container.
#
# Docker Spaces moved behind PRO, and every remaining free tier that runs a
# container sleeps — so a judge's first visit would wait on a cold start, on the
# one day it matters. Static Spaces are free, and they do not sleep.
#
# Nothing was compromised to fit: `python -m praman export` writes what the
# API's four endpoints already return, at the same paths, and the arena fetches
# them relatively so the identical frontend serves both. The FastAPI server is
# untouched and still the thing CI tests.
#
# Runs after CI, and only if CI passed. A red suite that deploys anyway is a
# public URL that disagrees with its own badge.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  SPACE: DnyaneshU/praman

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: build the arena
        run: python -m praman export --out dist

      # Spaces are configured by YAML front matter in their README. Generated
      # here rather than committed: GitHub renders front matter as a stray
      # table above the title, and the repo's front page is the first thing a
      # judge reads.
      - name: give the space its front matter
        run: |
          {
            echo '---'
            echo 'title: Praman Arena'
            echo 'emoji: 🛡️'
            echo 'colorFrom: red'
            echo 'colorTo: indigo'
            echo 'sdk: static'
            echo 'app_file: index.html'
            echo 'pinned: false'
            echo 'short_description: Breach and attack simulation for agentic payment mandates'
            echo '---'
            echo
            cat README.md
          } > dist/README.md

      - name: push to the space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not set — add it under Settings → Secrets → Actions"
            exit 1
          fi
          cd dist
          git init -q -b main
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          # A fresh history each time: the Space holds a build, not a branch
          # anyone commits to, and a campaign deleted upstream must not survive
          # in it as a row the data no longer backs.
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" main
          echo "::notice::deployed https://huggingface.co/spaces/${SPACE}"
